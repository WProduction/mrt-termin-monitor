# Institute der Studie – Package-Data, ändert sich nur mit einem Release.
#
# Je Institut ein Block unter seinem Slug (ASCII-snake_case, z. B. dz_stadlau). Der
# Slug ist der stabile Join-Schlüssel der Zeitreihe (CSV-Spalte institut_id) und
# wird nach dem ersten Messlauf nie mehr umbenannt.
#
#   <slug>:
#     name: <lesbarer Institutsname>          # CSV-Spalte institut_name
#     adapter: xrweb|klinix|miranext|doctena|patapp|iris
#     abrechnung: kasse|kombiniert            # nur ÖGK-Termine; privat wird abgelehnt
#     timeout_s: <Sekunden>                   # optional, nur für langsame Portale
#     <adapter>:                              # Standort-Parameter des Portals
#       ...
#     untersuchungen:                         # knie_rechts|lws|mr_angio_nieren_km
#       knie_rechts:
#         ...                                 # adapter-spezifisch (Code, Muster …)
#
# Der Loader (sites.py) prüft alles vor dem ersten Request; ein Fehler hier bricht
# den Lauf mit Konfigurationsfehler ab, statt Fehlzeilen zu erzeugen.

# --- XR-WEB (D.A.T.A.): ein GET je Untersuchung auf
# /AppointmentSearch/directAppointmentSearch?exas=<code>[&Site=<site_param>].
# day_table_columns ist bei allen live geprüften Mandanten 2 (Vormittag/Nachmittag;
# die Datumsspalte zählt nicht mit). expected_title wird als Teilstring geprüft und
# schützt davor, dass ein umbenannter Code still eine andere Untersuchung misst.
# Host-Schreibweise je Mandant geprüft: radiologie.at-Mandanten nur mit „www.“,
# imaging.at-Mandanten und xrweb.mr-vorarlberg.at nur ohne.

radiologicum_penzing:
  name: MR-CT Wien-West / Radiologicum Penzing
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    host: www.radiologicum.radiologie.at
    site_param: p
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: mknie re                      # mit Leerzeichen, der Adapter percent-encodet
      expected_title: MR Kniegelenk       # matcht „… rechts“ und „… links oder rechts“

dz_stadlau:
  name: DZ Stadlau
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    host: www.dzstadlau.radiologie.at
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: mrknieonline                  # seitenneutraler Sammelcode
      expected_title: MRT Knie

