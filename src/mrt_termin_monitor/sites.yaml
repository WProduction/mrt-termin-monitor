# Institute der Studie – Package-Data, ändert sich nur mit einem Release.
#
# Je Institut ein Block unter seinem Slug (ASCII-snake_case, z. B. dz_stadlau). Der
# Slug ist der stabile Join-Schlüssel der Zeitreihe (CSV-Spalte institut_id) und
# wird nach dem ersten Messlauf nie mehr umbenannt.
#
#   <slug>:
#     name: <lesbarer Institutsname>          # CSV-Spalte institut_name
#     adapter: xrweb|klinix|miranext|doctena|patapp|iris
#     abrechnung: kasse|kombiniert            # nur ÖGK-Termine; privat wird abgelehnt
#     timeout_s: <Sekunden>                   # optional, nur für langsame Portale
#     <adapter>:                              # Standort-Parameter des Portals
#       ...
#     untersuchungen:                         # knie_rechts|lws|mr_angio_nieren_km
#       knie_rechts:
#         ...                                 # adapter-spezifisch (Code, Muster …)
#
# Kein Portal bietet für lws/mr_angio_nieren_km eine Kontrastmittel-Wahl; gemessen
# wird der neutrale Eintrag (Stand 2026-11-01).
#
# Der Loader (sites.py) prüft alles vor dem ersten Request; ein Fehler hier bricht
# den Lauf mit Konfigurationsfehler ab, statt Fehlzeilen zu erzeugen.

# --- XR-WEB (D.A.T.A.): ein GET je Untersuchung auf
# /AppointmentSearch/directAppointmentSearch?exas=<code>[&Site=<site_param>].
# day_table_columns ist bei allen live geprüften Mandanten 2 (Vormittag/Nachmittag;
# die Datumsspalte zählt nicht mit). expected_title wird als Teilstring geprüft und
# schützt davor, dass ein umbenannter Code still eine andere Untersuchung misst.
# Host-Schreibweise je Mandant geprüft: radiologie.at-Mandanten nur mit „www.“,
# imaging.at-Mandanten und xrweb.mr-vorarlberg.at nur ohne.

radiologicum_penzing:
  name: MR-CT Wien-West / Radiologicum Penzing
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    host: www.radiologicum.radiologie.at
    site_param: p
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: mknie re                      # mit Leerzeichen, der Adapter percent-encodet
      expected_title: MR Kniegelenk       # matcht „… rechts“ und „… links oder rechts“
    lws:
      code: mlws
      expected_title: MR Lendenwirbelsäule  # Portal-Titel mit echtem Umlaut (Datei als UTF-8 speichern)

dz_stadlau:
  name: DZ Stadlau
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    host: www.dzstadlau.radiologie.at
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: mrknieonline                  # seitenneutraler Sammelcode
      expected_title: MRT Knie
    lws:
      # Sammelcode Wirbelsäule: Oberbegriff derselben Region – ein Patient mit
      # LWS-Zuweisung bucht im Portal genau diesen Eintrag.
      code: mr1wsonline                   # Ziffer 1, nicht Buchstabe l: „1ws“ = eine Wirbelsäulenregion
      expected_title: MRT Wirbelsäule Einzelregion

dz_simmering:
  name: DZ Simmering
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    host: www.dh11.radiologie.at
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: mrknr
      expected_title: MR Knie             # voller Titel „MR Knie (links/rechts)“
    lws:
      code: mrlws                         # aus dem Deep-Link des Betreibers für Standort 11
      expected_title: MR LWS              # voller Titel „MR LWS“; einziger Schutz gegen stilles Umhängen des Codes

dz_urania:
  name: DZ Urania
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    host: webportal.urania.imaging.at
    site_param: ur
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: mrknieonline                  # seitenneutral
      expected_title: MRT Knie
    lws:
      # Sammelcode Wirbelsäule: ein Eintrag für die ganze WS-Region, HWS/BWS/LWS
      # teilen ihn – ein LWS-Patient müsste im Portal genau diesen Eintrag wählen.
      code: mr1wsonline                   # „mr“ + Ziffer „1“ + „wsonline“, nicht Buchstabe „l“
      expected_title: MRT Region der Wirbelsäule

imagin_floridsdorf:
  name: imagin Floridsdorf
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    host: webportal.floridsdorf.imaging.at
    site_param: flo
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: mrknieonline                  # seitenneutral
      expected_title: MRT Knie
    lws:
      # Sammelcode Wirbelsäule: HWS, BWS und LWS teilen sich einen Eintrag, den
      # ein LWS-Patient genau so buchen müsste. Im Code steht die Ziffer 1 („mr1ws“),
      # nicht der Buchstabe l.
      code: mr1wsonline
      # Bewusst nur der Titel-Anfang: der volle Titel trägt unregelmäßige
      # Leerzeichen („(HWS/ BWS /LWS)“), die das Portal jederzeit glätten könnte.
      expected_title: MRT Region der Wirbelsäule

diagnosehaus_3:
  name: Diagnosehaus 3
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    host: www.dh3.radiologie.at           # antwortet mit 302 auf denselben Host
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: mrknr
      expected_title: MR Knie
    lws:
      code: mrlws
      expected_title: MR LWS              # Portal druckt den Titel zweimal (Untersuchungen:/Information:)

hansson_diagnostik:
  name: Hansson Diagnostik
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    host: www.hansson-diagnostik.radiologie.at
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: onmrkn                        # seitenneutral, der Katalog kennt kein re/li
      expected_title: MR Knie
    lws:
      # Sammelcode Wirbelsäule: Der Katalog führt keinen eigenen LWS-Eintrag; ein
      # Patient mit LWS-Zuweisung müsste genau diesen Sammeleintrag wählen.
      # Das Präfix „on“ heißt hier „online“, nicht „privat“.
      code: onmrws                        # Sammeleintrag „MR Wirbelsäule“, kein eigener LWS-Code
      expected_title: MR Wirbelsäule

radiologie_waidhofen:
  name: Radiologie Waidhofen/Ybbs
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    host: www.waidhofen.radiologie.at     # nur ein Teil der Termine ist online buchbar
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: knr-mr
      expected_title: MRT Knie rechts
    lws:
      code: lws-mr
      # Präfix statt Volltitel „MRT Lendenwirbelsäule (LWS)“: eine kosmetische
      # Änderung der Klammer soll kein fehler_parsen auslösen; der Präfix ist
      # im Katalog eindeutig.
      expected_title: MRT Lendenwirbelsäule

dz_baden:
  name: MR DZ Baden
  adapter: xrweb
  abrechnung: kombiniert
  # Die Weiterleitungsseite (kein Online-Termin oder ungültiger Code) kommt hier
  # erst nach rund 32 s; mit 30 s wäre das „nicht erhoben“ statt „Weiterleitung“.
  timeout_s: 45
  xrweb:
    host: webportal.dzbaden.at
    site_param: b
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: mrknr                         # Portal-Code aus der URL (exas=mrknr), nicht abgeleitet
      expected_title: MRT des rechten Kniegelenkes   # Live-Titel vom 2026-11-01
    lws:
      code: mrlw                          # Portal-Code aus der URL (exas=mrlw), nicht abgeleitet
      expected_title: MRT der Lendenwirbelsäule   # Live-Titel vom 2026-11-01; bei Abweichung fehler_parsen statt ok
    mr_angio_nieren_km:
      code: mra-niere                     # einziger Nierenangiographie-Eintrag; Portal bietet keine KM-Wahl
      expected_title: MR-Angiographie der Nierenarterien   # Live-Titel vom 2026-11-01

rainer_zwettl:
  name: Dr. Rainer Diagnostik, Zwettl
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    host: www.rainer.radiologie.at
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: sd0050                        # hausinternes Schema sd00xx
      expected_title: MR-Knie             # mit Bindestrich
    lws:
      # Sammelcode Wirbelsäule: das Portal führt HWS/BWS/LWS als einen Eintrag;
      # ein LWS-Patient müsste genau diesen wählen, deshalb zählt er für lws.
      code: sd0031                        # Sammel-Eintrag HWS/BWS/LWS
      expected_title: MR-Wirbelsäule      # mit Bindestrich, trennt von „MR Gesamte Wirbelsäule“

suedost_feldbach:
  name: CT/MR Institut Südost (Feldbach)
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    # Der Server liefert sein Zwischenzertifikat nicht mit; der Abruf braucht
    # das mitgelieferte extra-ca.pem.
    host: www.suedost.radiologie.at
    # Ein Site-Parameter (fe/fu) ändert nur das Branding, die Antwort ist mit
    # und ohne ihn identisch – deshalb weggelassen.
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: onmrkn                        # einziger Knie-Eintrag, ohne Seite
      expected_title: MR Knie

mr_ct_klagenfurt:
  name: MR-CT Diagnose Institut Klagenfurt
  adapter: xrweb
  abrechnung: kasse                       # Privat-Track ist eine eigene Rechtsperson
  xrweb:
    host: www.mr-ct-klagenfurt.radiologie.at
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: onmrk                         # seitenneutral
      expected_title: MRT Knie
    lws:
      # Das Präfix „on“ steht bei diesem Mandanten für „online“, nicht für
      # „privat“ – andere Mandanten nutzen dasselbe Präfix für den Privatpool.
      code: onmrlws
      expected_title: MRT LWS

mr_bregenz:
  name: MR Institut Bregenz
  adapter: xrweb
  # Kassen- und Privatpool haben eigene Codes und eigene Termine; erhoben wird
  # nur der Kassenpool.
  abrechnung: kasse
  xrweb:
    host: xrweb.mr-vorarlberg.at          # die www-Variante hat ein fremdes Zertifikat
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: mknr                          # Kassen-Code rechts
      # Voller Kassen-Titel: „MRT Knie“ träfe als Teilstring auch den Privatpool
      # („MRT Knie Privat rechts“) – ein auf Privat umgestellter Code fiele sonst
      # nicht auf.
      expected_title: MRT Knie rechts
    lws:
      code: mlws                          # Kassen-Code LWS (Gruppe 1288, site=bregrad)
      # Privat-Zwilling ist „onmlws“ – „on“ heißt bei diesem Mandanten „privat“,
      # nicht „online“. Maßgeblich ist der Code; gewählt ist der Kassen-Code.
      # Voller Kassen-Titel. Der Privat-Zwilling heißt „MRT LWS Privat“ und enthält
      # diesen Titel als Präfix – die Titelprüfung schützt hier also NICHT gegen
      # einen auf Privat umgestellten Code.
      expected_title: MRT LWS

mr_feldkirch:
  name: MR Institut Feldkirch
  adapter: xrweb
  abrechnung: kasse                       # Privatgruppe des Katalogs ist leer
  xrweb:
    host: www.feldkirch.radiologie.at
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: onmKnie                       # Binnengroßschreibung wie im Katalog
      # Der Mandant hängt Lauftext an den Namen; nur der stabile Anfang.
      expected_title: MRT Knie
    lws:
      # Sammelcode Wirbelsäule: ein Sammel-Eintrag für die GANZE Wirbelsäule;
      # einen LWS-eigenen Eintrag gibt es im Katalog nicht. Ein LWS-Patient
      # müsste genau diesen Eintrag wählen, daher zählt er für den Fall –
      # gemessen wird aber der Wirbelsäulen-Pool insgesamt.
      # Das Präfix „on“ heißt bei diesem Mandanten „online“, nicht „privat“.
      code: onmws
      # Der Mandant hängt Lauftext an den Namen; nur der stabile Anfang.
      expected_title: MRT Wirbelsäule

# --- klinix (Diagnostikum-Gruppe): ein anonymer GET je Untersuchung auf
# /services/klinixservice/api/public/appointment-slot/first-available-slot-time?exas=<code>.
# Die Antwort ist schon der Messwert: ein JSON-String mit dem Zeitstempel des
# nächsten freien Termins; ein leerer Body heißt „kein Termin“. Ein serverseitig
# unbekannter Code liefert ebenfalls einen leeren Body und fällt deshalb nur als
# Dauer-„keine Termine“ auf – es gibt keine Titelprüfung wie bei XR-WEB (der
# Vorbehalt steht im Hinweis jeder solchen Zeile).
# Die Route kennt keinen Kostenträger-Parameter: gemessen wird der eine gemeinsame
# Pool, daher überall kombiniert. Der Code mknr ist „Kniegelenk rechts“, Modalität MR.

dz_meidling:
  name: DZ Meidling
  adapter: klinix
  abrechnung: kombiniert                  # ein Pool, Zahler nur Formularfeld
  klinix:
    host: portal-dzm.diagnostikum.at
  untersuchungen:
    knie_rechts:
      code: mknr                          # Rechts-Code
    lws:
      code: mlws                          # „MRT der Lendenwirbelsäule“

diagnostikum_linz:
  name: Diagnostikum Linz
  adapter: klinix
  abrechnung: kombiniert
  klinix:
    host: portal-dl.diagnostikum.at
  untersuchungen:
    knie_rechts:
      code: mknr
    lws:
      code: mlws                          # Portal-Kürzel für „MRT der Lendenwirbelsäule“
    mr_angio_nieren_km:
      # Einziger, neutraler Eintrag für die Nierenarterien – Kontrastmittel ist im
      # Portal nicht wählbar.
      code: mani                          # Portal-Kürzel für „MR Angiographie der Nierenarterien“

diagnostikum_graz_suedwest:
  name: Diagnostikum Graz Süd-West
  adapter: klinix
  abrechnung: kombiniert
  klinix:
    host: portal-dg.diagnostikum.at
  untersuchungen:
    knie_rechts:
      code: mknr
    lws:
      code: mlws                          # Portalcode „MRT der Lendenwirbelsäule“
    mr_angio_nieren_km:
      code: mani                          # einziger Portaleintrag „MR Angiographie der Nierenarterien“; KM nicht wählbar

# --- MiraNext (Patientenportal mit JSON-API unter /api/booking): je Untersuchung
# zwei GETs. Erst die Service-Zuordnung per Suchbegriff – die Zuordnungs-ID wird zur
# Laufzeit über exakten Namen und Gerät aufgelöst, damit eine Umnummerierung des
# Katalogs nicht still eine andere Untersuchung misst –, dann die freien Slots genau
# dieser Zuordnung, nur mit Kassen-Abrechnung. Die API verlangt einen Referer/Origin
# der Portalseite; das ist keine Zugangskontrolle, es gibt weder Schlüssel noch Token.
# Kassen- und Privatpool laufen auf getrennten Geräten; abgefragt wird nur das
# Kassengerät.

doringer_salzburg:
  name: Radiologie Doringer, Salzburg
  adapter: miranext
  abrechnung: kasse                       # eigenes Kassengerät; das Privatgerät wird nie abgefragt
  miranext:
    portal_id: 3                          # Mandant, API-Parameter c_Id (id= liefert 403)
    device: MR                            # Kassengerät; PMR-S = Privat, PMR-SF nicht online buchbar
  untersuchungen:
    knie_rechts:
      search: Kniegelenk                  # Suchbegriff der Service-Zuordnung
      service_name: MR Kniegelenk rechts  # exakt; „bds.“ und „je Seite“ fallen so heraus
      # Erwartungswert: weicht die aufgelöste ID ab, steht das im Hinweis, gemessen
      # wird mit der aufgelösten.
      expected_id: 4d9ade1e-ece0-5017-a0b5-9ce8814ae193
    lws:
      search: LWS                         # Suchbegriff der Service-Zuordnung
      service_name: MR LWS                # exakt; „HWS, BWS und LWS“ und „LWS und Hüftgelenk …“ fallen so heraus
      # Erwartungswert: weicht die aufgelöste ID ab, steht das im Hinweis, gemessen
      # wird mit der aufgelösten.
      expected_id: 2db70331-e056-57bc-9195-2ee6c7798cb5

# --- Doctena: ein GET je Untersuchung auf api.doctena.at/agendaSlot (HAL+JSON),
# Suchfenster 30 Tage ab Lauf-Tag 00:00. Größere Fenster liefern bei dieser API
# still eine leere Slot-Liste statt eines Fehlers (120 Tage geprüft); keine_termine
# heißt hier deshalb „kein Termin innerhalb 30 Tagen“. doctor = Doctena-Kalender
# des Standorts, reason = Doctena-Besuchsgrund je Untersuchung, beide als Zahl
# ohne Quotes. Beide Ids vergibt Doctena; sie können bei einer Umkonfiguration
# driften. Wird der Zugriff abgelehnt (HTTP-Fehler, fremde Antwort), gibt es
# keinen Ausweichweg: das Institut wird dann nicht gemessen.

ambulatorium_doebling:
  # Gebucht wird beim Ambulatorium Döbling (Mavie Med Ambulatorien GmbH), nicht
  # bei der Privatklinik Döbling auf demselben Campus – getrennte Rechtspersonen.
  name: Ambulatorium Döbling
  adapter: doctena
  # Ein Slot-Pool ohne Kassen-/Privat-Auswahl; das Institut rechnet MRT als
  # Kassenleistung oder Wahlarzt-Tarif ab.
  abrechnung: kombiniert
  doctena:
    doctor: 1779969                       # Kalender „MRT 3 Tesla / Magnetresonanz“
  untersuchungen:
    knie_rechts:
      # Besuchsgrund „MRT Knie“, seitenneutral (die Seite steht erst in der
      # Zuweisung). Einziger offen buchbarer Knie-Grund: die zuweiser-gebundenen
      # Varianten liefern immer leere Listen, ein Wechsel ergäbe still keine_termine.
      reason: 202298

# --- IRIS (Lukassoftware, InterSystems-IRIS-Backend): ohne SVNR lesbar. Eine
# anonyme Session (POST <base_url>/api/session) liefert ein Bearer-Token, danach
# GETs: Katalog der kategorie -> Terminarten der gewählten Untersuchung -> freie
# Termine je Terminart (höchstens drei, gemessen wird das Minimum über alle) im
# Horizont von horizon_days ab dem Tag nach dem Lauf.
# pattern ist ein Regex auf „Bezeichnung Lateralität“ des Katalogeintrags und muss
# genau EINEN Eintrag der kategorie treffen; „Knie“ allein trifft links, rechts und
# beidseits und wird zur Fehlerzeile. kalender und ressource führt der Katalog
# nicht: sie stehen nur im ausgelieferten Client-Code des Mandanten. Ändert der
# Anbieter sein Frontend, zeigt sich das als keine_termine statt als Fehler.
# ressource darf eine Liste sein (A,B = zwei Geräte eines Pools in einem Request,
# genau wie der Portal-Client fragt).

rz_kapfenberg:
  name: Radiologisches Zentrum Kapfenberg
  adapter: iris
  abrechnung: kombiniert                  # eine Zeit, keine Kasse/Privat-Trennung publiziert
  iris:
    base_url: https://exchange.radiolog.at/terminbuchung
    kategorie: MRT
    kalender: B                           # Client-Code, Kategorie MRT
    ressource: A
    horizon_days: 180
  untersuchungen:
    knie_rechts:
      pattern: Knie rechts                # trifft den Rechts-Code, nicht seitenneutral
    lws:
      pattern: Lendenwirbelsäule          # nur Eintrag 481; „LWS“ träfe auch BWS+LWS und HWS+LWS

dok_schwaz:
  name: Kompetenzzentrum DOK Schwaz
  adapter: iris
  # Kasse = ein gemeinsamer Pool aller Kassen; Privat ist eine eigene Terminart,
  # die der Katalog nicht zur Untersuchung liefert – sie wird nie abgefragt.
  abrechnung: kasse
  iris:
    base_url: https://smart.mein-dok.at/terminbuchung
    kategorie: MRT
    kalender: M                           # nur der Standort Schwaz hat online einen MRT-Kalender
    ressource: A,B                        # beide Geräte in einem Request, wie der Client
    horizon_days: 180
  untersuchungen:
    knie_rechts:
      pattern: Knie rechts                # trifft den Rechts-Code, nicht seitenneutral

# --- HGS PatApp/PatWeb: SOAP über POST an service_url, je Institut drei lesende
# Aufrufe: GetShortLongTitles (Katalog, ohne Anmeldung) -> GetPatientTicket
# (Anmeldung mit der SVNR aus credentials.yaml, nie aus dieser Datei) ->
# GetProposedDates je Untersuchung. Die Untersuchungscodes sind hausintern und
# stehen in keiner öffentlichen Datei; der Adapter wählt sie bei jedem Lauf über
# `pattern` (Regex, Groß-/Kleinschreibung egal) auf dem Klartext des Katalogs,
# nur Modalität MR. Trifft das Muster keinen oder mehr als einen Eintrag, liefert
# der Block fehler_parsen mit der Kandidatenliste im hinweis – nie eine geratene
# Untersuchung. service_url ist der Dienst (…/service.asmx), nicht die Portalseite.

roentgen_wien_nord:
  name: Röntgen Wien Nord
  adapter: patapp
  abrechnung: kombiniert
  patapp:
    service_url: https://termin.roentgen-wien-nord.at/hgsservice/service.asmx
  untersuchungen:
    knie_rechts:
      pattern: Knie                       # trifft nur „MR-Knie“; der Katalog kennt kein re/li

rachinger_linz:
  name: Dr. Rachinger, Linz
  adapter: patapp
  # Kassen-Track mit eigenem Dienst; der Privat-Track läuft über einen anderen
  # Dienst und führt im Katalog eigene Codes mit Modalität MRP – wird nicht
  # abgefragt.
  abrechnung: kasse
  patapp:
    service_url: https://onlinekalender.institut-rachinger.at/hgsservice/service.asmx
  untersuchungen:
    knie_rechts:
      # Trifft nur „Kniegelenk“ (seitenneutral); der Privat-Eintrag desselben
      # Katalogs hat die Modalität MRP und fällt durch den MR-Filter.
      pattern: Knie

mr_ct_horn:
  name: MR-CT DZ Horn
  adapter: patapp
  abrechnung: kasse                       # Privattermine nur telefonisch
  patapp:
    # Eigener Dienstpfad des Standorts Horn; der zweite Standort wird nicht abgefragt.
    service_url: https://termin.diagnose.team/hgsserviceho/service.asmx
  untersuchungen:
    knie_rechts:
      pattern: Kniegelenk rechts          # nur seitengetrennt geführt; „Knie“ träfe beide Seiten
