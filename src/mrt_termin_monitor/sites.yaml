      expected_title: MRT Knie

dz_baden:
  name: MR DZ Baden
  adapter: xrweb
  abrechnung: kombiniert
  # Bei erschöpftem Pool antwortet der Endpunkt erst nach rund 32 s mit der
  # Weiterleitungsseite; mit 30 s wäre das „nicht erhoben“ statt „Weiterleitung“.
  timeout_s: 45
  xrweb:
    host: webportal.dzbaden.at
    site_param: b
    day_table_columns: 2
  # Titel und Spaltenzahl sind Annahmen: bisher kam nur die Weiterleitungsseite
  # zurück. Bei der ersten Antwort mit Tages-Tabelle gegen den Live-Titel prüfen;
  # weicht er ab, liefert der Block fehler_parsen statt ok.
  untersuchungen:
    knie_rechts:
      code: '2244'                        # gequotet: der Code ist ein String
      expected_title: MRT Knie

rainer_zwettl:
  name: Dr. Rainer Diagnostik, Zwettl
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    host: www.rainer.radiologie.at
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: sd0050                        # hausinternes Schema sd00xx
      expected_title: MR-Knie             # mit Bindestrich

suedost_feldbach:
  name: CT/MR Institut Südost (Feldbach)
  adapter: xrweb
  abrechnung: kombiniert
  xrweb:
    # Der Server liefert sein Zwischenzertifikat nicht mit; der Abruf braucht
    # das mitgelieferte extra-ca.pem.
    host: www.suedost.radiologie.at
    # Ein Site-Parameter (fe/fu) ändert nur das Branding, die Antwort ist mit
    # und ohne ihn identisch – deshalb weggelassen.
    day_table_columns: 2
  untersuchungen:
    knie_rechts:
      code: onmrkn                        # einziger Knie-Eintrag, ohne Seite
      expected_title: MR Knie

