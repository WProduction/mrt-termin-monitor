name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    # Windows, weil das Zielsystem Windows ist (Encoding-/cp1252-Fallen).
    runs-on: windows-latest
    # Genau die Versionen, für die das Release-ZIP Wheels enthält (PYTHONS in
    # tools/build_release.py); .python-version gilt nur lokal.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: requirements.txt-Drift gegen uv.lock
        run: uv export --no-dev --no-emit-project --format requirements-txt -o requirements.txt && git diff --exit-code requirements.txt
